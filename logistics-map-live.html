<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Skelsee Logistics — Reorder & Prospect Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--ink:#12242e;--paper:#f5f2ec;--panel:#fff;--line:#d9d2c5;--accent:#1f4e78;--muted:#5c6670;
    --cust:#1f4e78;--farm:#5a8f7b;--mine:#8a6d3b;--inseason:#c0392b;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{background:var(--ink);color:var(--paper);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
  header h1{font-size:15px;font-weight:700}
  header .date{font-size:11px;color:#b8c2c9;margin-left:auto}
  .wrap{flex:1;display:flex;min-height:0}
  #map{flex:1;min-height:0}
  .side{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .layer-toggles{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
  .layer-toggles label{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}
  .layer-toggles .cnt{margin-left:auto;color:var(--muted);font-size:11px}
  .sw{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .toolbar{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar select{font-family:var(--font);font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;flex:1}
  .summary{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px}
  .summary .big{font-size:20px;font-weight:700;color:var(--accent)}
  .summary .lit{color:var(--muted);font-size:11px}
  .list{flex:1;overflow-y:auto}
  .row{padding:8px 12px;border-bottom:1px solid #eee;cursor:pointer;font-size:12px}
  .row:hover{background:#faf8f4}
  .row .nm{font-weight:600;display:flex;align-items:center;gap:6px}
  .row .mt{color:var(--muted);font-size:11px;margin-top:2px}
  .tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:auto;color:#fff}
  .demo-note{background:#fff8e1;color:#8a6d1a;font-size:10px;padding:4px 14px;text-align:center}
  .leaflet-popup-content{font-family:var(--font);font-size:12px;line-height:1.5}
  .leaflet-popup-content b{color:var(--accent)}
  @media(max-width:720px){.wrap{flex-direction:column}.side{width:100%;height:46%;border-left:none;border-top:1px solid var(--line)}#map{height:54%}}

  .gate{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:9999}
  .gate .card{background:var(--panel);border-radius:14px;padding:26px 24px;width:300px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .gate h2{font-size:17px;margin-bottom:4px;color:var(--ink)}
  .gate p{font-size:12px;color:var(--muted);margin-bottom:16px}
  .gate input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;margin-bottom:10px;font-family:var(--font)}
  .gate button{width:100%;padding:10px;border:none;border-radius:7px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
  .gate button:disabled{opacity:.6}
  .gate .err{color:#c0392b;font-size:11px;margin-top:8px;min-height:14px}
  .banner{background:#fdecea;color:#c0392b;font-size:11px;padding:6px 14px;text-align:center;display:none}
  .banner.show{display:block}
</style>
</head>

<div class="gate" id="gate">
  <div class="card">
    <h2>Skelsee Logistics</h2>
    <p>Route & prospect planner — ops / admin sign in.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">

    <div class="err" id="loginErr"></div>
  </div>
</div>
<div class="banner" id="banner"></div>

let DATA=[];

const SEASON={TOBACCO:[1,12],MAIZE:[8,6],WHEAT:[4,10],BARLEY:[4,10],SOYBEANS:[9,5],SUNFLOWER:[9,6],COTTON:[9,8],SUGARCANE:[1,12],POTATOES:[1,12],CITRUS:[1,12],DAIRY:[1,12],POULTRY:[1,12]};
const COL={customer:'#1f4e78',farmer:'#5a8f7b',mine:'#8a6d3b'};
const MM=new Date().getMonth()+1;
function inSeason(crop){const w=SEASON[crop];if(!w)return null;const[a,b]=w;return a<=b?(MM>=a&&MM<=b):(MM>=a||MM<=b);}

let map,markers=[];
function initMap(){map=L.map('map',{zoomControl:true}).setView([-17.8,30.8],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);}

function typeOn(t){return t==='customer'?tgCust.checked:t==='farmer'?tgFarm.checked:tgMine.checked;}
function visible(){
  const area=areaFilter.value, sf=seasonFilter.value;
  return DATA.filter(d=>{
    if(!typeOn(d.t))return false;
    if(area!=='all' && (d.a||'').toUpperCase()!==area)return false;
    if(sf==='in_season'){const s=inSeason(d.c);if(d.t==='farmer'&&s===false)return false;}
    return true;
  });
}
function render(){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const vis=visible();
  vis.forEach(d=>{
    const seasonHot=d.t==='farmer'&&inSeason(d.c)===true;
    const m=L.circleMarker([d.lat,d.lng],{radius:d.t==='customer'?7:6,
      fillColor:seasonHot?'#c0392b':COL[d.t],color:'#fff',weight:1.5,fillOpacity:.85}).addTo(map);
    const seas=d.c?(inSeason(d.c)===true?' · in-season now':inSeason(d.c)===false?' · off-season':''):'';
    m.bindPopup('<b>'+d.n+'</b><br>'+(d.t==='customer'?'Existing customer':d.t==='mine'?'Mine (prospect)':'Farmer (prospect)')+
      '<br>'+(d.a||'area unknown')+(d.c?'<br>Crop: '+d.c+seas:'')+(d.t!=='customer'?'<br><i>potential to fill tank space</i>':''));
    markers.push(m);
  });
  visCount.textContent=vis.length;
  const nc=vis.filter(d=>d.t==='customer').length,nf=vis.filter(d=>d.t==='farmer').length,nm=vis.filter(d=>d.t==='mine').length;
  visSub.textContent=nc+' customers · '+nf+' farmers · '+nm+' mines';
  // list: in-season farmers + mines first (the fill-space targets)
  vis.sort((a,b)=>{const ha=a.t==='farmer'&&inSeason(a.c)===true?0:a.t!=='customer'?1:2;
    const hb=b.t==='farmer'&&inSeason(b.c)===true?0:b.t!=='customer'?1:2;return ha-hb;});
  list.innerHTML=vis.slice(0,120).map((d,i)=>{
    const hot=d.t==='farmer'&&inSeason(d.c)===true;
    const tag=d.t==='customer'?'':hot?'<span class="tag" style="background:#c0392b">IN SEASON</span>':
      d.t==='mine'?'<span class="tag" style="background:#8a6d3b">MINE</span>':'<span class="tag" style="background:#5a8f7b">FARMER</span>';
    return '<div class="row" data-i="'+i+'"><div class="nm"><span class="sw" style="background:'+(hot?'#c0392b':COL[d.t])+'"></span>'+d.n+tag+
      '</div><div class="mt">'+(d.a||'—')+(d.c?' · '+d.c:'')+'</div></div>';
  }).join('')||'<div style="padding:14px;color:#9aa0a6">No pins match.</div>';
  [...list.querySelectorAll('.row')].forEach(el=>el.onclick=()=>{const d=vis[+el.dataset.i];
    map.setView([d.lat,d.lng],11);markers.forEach(m=>{const ll=m.getLatLng();if(ll.lat===d.lat&&ll.lng===d.lng)m.openPopup();});});
}
function fillAreas(){
  const areas=[...new Set(DATA.map(d=>(d.a||'').toUpperCase()).filter(Boolean))].sort();
  areaFilter.innerHTML='<option value="all">All areas</option>'+areas.map(a=>'<option>'+a+'</option>').join('');
}
function counts(){cCust.textContent=DATA.filter(d=>d.t==='customer').length;
  cFarm.textContent=DATA.filter(d=>d.t==='farmer').length;cMine.textContent=DATA.filter(d=>d.t==='mine').length;}
today.textContent=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
['tgCust','tgFarm','tgMine','areaFilter','seasonFilter'].forEach(id=>document.getElementById(id).onchange=render);


// ---- AUTH ----
async function tryExistingSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){ await afterLogin(); }
}
async function doLogin(){
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  btn.disabled=true; err.textContent='';
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){ err.textContent=error.message; btn.disabled=false; return; }
  await afterLogin();
}
async function afterLogin(){
  document.getElementById('gate').style.display='none';
  await loadData();
}

// ---- DATA ----
async function loadData(){
  const banner=document.getElementById('banner');
  try{
    const pRes = await sb.from('map_prospect_feed').select('*');
    if(pRes.error) throw pRes.error;
    const prospects=(pRes.data||[]).map(r=>({
      n:r.name, t:r.entity_type, s:'prospect', a:r.area||'',
      lat:Number(r.lat), lng:Number(r.lng),
      c:(Array.isArray(r.crops)&&r.crops[0])?r.crops[0]:''
    })).filter(d=>!isNaN(d.lat)&&!isNaN(d.lng));

    // customers: optional — view may not exist yet (invoices not loaded).
    let customers=[];
    try{
      const cRes = await sb.from('map_customer_feed').select('*');
      if(!cRes.error && cRes.data){
        customers=cRes.data.map(r=>({
          n:r.customer_name||r.name, t:'customer', s:'customer',
          a:r.usual_location||'', lat:Number(r.lat), lng:Number(r.lng), c:''
        })).filter(d=>!isNaN(d.lat)&&!isNaN(d.lng));
      }
    }catch(_){ /* customer feed not ready yet — fine */ }

    DATA=[...customers,...prospects];
    if(DATA.length===0){
      banner.textContent='Connected, but no rows returned — your account may lack ops/admin access.';
      banner.classList.add('show');
      DATA=DEMO;
    }else{
      const dn=document.getElementById('demoNote'); if(dn) dn.style.display='none';
      if(customers.length===0){
        banner.textContent='Showing '+prospects.length+' prospects. Customer layer loads once invoice data is in.';
        banner.classList.add('show');
      }
    }
  }catch(e){
    banner.textContent='Could not reach database ('+ (e.message||e) +') — showing demo pins.';
    banner.classList.add('show');
    DATA=DEMO;
  }
  initMap(); fillAreas(); counts(); render();
}

today.textContent=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
['tgCust','tgFarm','tgMine','areaFilter','seasonFilter'].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
tryExistingSession();
</script>
</body>
</html>
